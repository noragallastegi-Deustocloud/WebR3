<!DOCTYPE html>
<html>
<head>
    <title>Proyecto R3_Cuestionario</title>
    <link rel="icon" type="image/png" href="imagenes/logo2.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta http-equiv="content-type" content="text/html" charset="UTF-8"/>
</head>
<body>
    <div class="container" style="padding-right: 20px;"> 
        <div class="logos" style="align-items: right;">
            <img src="Recursos/Logos/R3.png" class="R3Logo2"/>
        </div>
        <h1 class="encabezado1" style="text-align: justify;" >¡Has finalizado el cuestionario!</h1>
        <p class="body" style="line-height: 2;text-align: justify;">Antes de enviarlo, puedes verificar que todas tus respuestas son correctas.</p>
        <p class="body" style="line-height: 2;text-align: justify;" >Una vez que hagas clic en el botón para enviar, no podrás regresar para hacer cambios,</p>
        <p class="body" style="line-height: 2;text-align: justify;" >ya que tus respuestas serán enviadas al servidor.</p>
       <div class="options-container" >
            <img src="Recursos\Preguntas\five_9426554.png" style="width: 30%;">
        </div>

        <div class="button-container">
            <button class="buttonatras" onclick="goToPreviousPage()">ATRÁS</button>
            <button id="enviarBtn" class="button" onclick="validateSelection()">
                <div id="enviar" style="display: block;">ENVIAR</div>
                <div id="cargando" style="display: none;">Enviando datos...</div>
             </button>
            
        </div>
    
        <div class="slider-container">
            <input type="range" min="1" id="progreso" class="slider" disabled>
            <p id="progreso-texto" class="body" style="color: white;"></p>
        </div>
    </div>

    <script>
        // Función para validar la selección antes de continuar
        function validateSelection() {
            // Llamar directamente a la función de enviar datos sin validar selección
            enviarDatosFinales();
        }
    
        // Función para enviar datos finales a la API
        function enviarDatosFinales() {
            const enviarBtn = document.getElementById('enviarBtn');
            const enviar = document.getElementById('enviar');
            const cargando = document.getElementById('cargando');
    
            // Desactiva el botón y muestra el símbolo de carga
            enviarBtn.disabled = true;
            enviar.style.display = "none";
            cargando.style.display = "block";
    
            const data = {
                nombre: sessionStorage.getItem('nombre'),
                fecha: sessionStorage.getItem('fecha'),
                edad: sessionStorage.getItem('edad'),
                colegio: sessionStorage.getItem('colegio'),
                comienzo: sessionStorage.getItem('comienzo'),
                r1: sessionStorage.getItem('r1'),
                r2: sessionStorage.getItem('r2'),
                r3: sessionStorage.getItem('r3'),
                r4: sessionStorage.getItem('r4'),
                r5: sessionStorage.getItem('r5'),
                r6: sessionStorage.getItem('r6'),
                pestana: "Planarias"
            };
    
            console.log("Enviando datos a la API:", data);
    
            fetch("https://sheetdb.io/api/v1/489tyk5a0v6tr?sheet=Planarias", {
                method: "POST",
                headers: { "Accept": "application/json",
                "Content-Type": "application/json"},
                body: JSON.stringify({
                data: [data] 
             })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Error en la respuesta de la API");
                }
                return response.json();
            })
            .then(data => {
                console.log("Respuesta de la API recibida:", data);
                window.location.href = "11_Agradeciemiento.html";
            })
            .catch(error => {
                console.error("Error al enviar los datos:", error);
                alert("Hubo un problema al enviar los datos. Por favor, intenta nuevamente.");
            })
            .finally(() => {
                // Re-activa el botón y oculta el símbolo de carga después de completar la solicitud
                enviarBtn.disabled = false;
                enviar.style.display = "block";
                cargando.style.display = "none";
            });
        }
    
        function goToPreviousPage() {
            window.location.href = "9_Pregunta6.html";
        }
    
        
        // Variables reutilizables
        const preguntaActual = 7; // <-- cambia este valor dinámicamente en cada página
        const progresoaActual = preguntaActual -1; 
        const totalPreguntas = 6;

        const slider = document.getElementById('progreso');
        const texto = document.getElementById('progreso-texto');

        // Configurar el slider
        slider.max = totalPreguntas;
        slider.value = preguntaActual;

        // Calcular porcentaje para fondo dinámico
        const porcentaje = (progresoaActual / totalPreguntas) * 100;
        slider.style.background = `linear-gradient(to right, #4CAF50 ${porcentaje}%, #ddd ${porcentaje}%)`;

        // Mostrar texto
        texto.textContent = `Pregunta ${preguntaActual} de ${totalPreguntas}`;
    </script>
    
</body>
</html>
