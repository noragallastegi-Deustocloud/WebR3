<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Proyecto R3_Cuestionario</title>
    <link rel="icon" type="image/png" href="imagenes/logo2.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta http-equiv="content-type" content="text/html" charset="UTF-8"/>
</head>
<body>

    <div class="container"> 
        <div class="logos" style="align-items: right;">
            <img src="Recursos/Logos/R3.png" class="R3Logo2"/>
        </div>
        
        <div class="container-image-text" style="flex-direction: column; align-items: flex-start; padding: 20px;">
            <p class="body" id="recordatorio" style="margin: 0 0 5px 0;">Te recordamos que las planarias y los humanos responden de manera similar ante ciertos estímulos.</p>
            <p class="body" style="margin: 0;">¿Cómo se comportará una persona si bebe una <b><span style="color: rgb(134, 130, 124);">bebida azucarada, </span></b> <img src="Recursos/Preguntas/iconos/5900722.png" alt="Icono de gota" style="width: 45px; vertical-align: middle; margin-left: 1px;"> por ejemplo un <b><span style="color: rgb(255, 106, 0);">zumo de naranja?</span></b><img src="Recursos/Preguntas/iconos/zumo.png" alt="Icono de gota" style="height: 35px; vertical-align: middle; margin-left: 15px;"></p>
        </div>

        <div class="options-container" >
            <div class="option" id="opt1" onclick="selectOption('opt1', 'r5', 'Estará menos activo')">
                <video src="Recursos/Preguntas/Humanos/Cansado.mp4" loop autoplay muted playsinline></video>                
                <input type="radio" name="option" id="radio1" style="pointer-events: none;">
                <p class="body" style="line-height: 1.5; text-align:center;">Estará menos activo</p>
            </div>
            <div class="option" id="opt2" onclick="selectOption('opt2', 'r5', 'Estará igual')">
                <video src="Recursos/Preguntas/Humanos/Andando.mp4" loop autoplay muted playsinline></video>                
                <input type="radio" name="option" id="radio2" style="pointer-events: none;">
                <p class="body" style="line-height: 1.5; text-align:center;">Estará igual que al principio</p>
            </div>
            <div class="option" id="opt3" onclick="selectOption('opt3', 'r5', 'Estará más activo')">
                <video src="Recursos/Preguntas/Humanos/Corriendo.mp4" loop autoplay muted playsinline></video>                
                <input type="radio" name="option" id="radio3" style="pointer-events: none;">
                <p class="body" style="line-height: 1.5; text-align:center;">Estará más activo</p>
            </div>
        </div>

        <div class="slider-container">
            <input type="range" min="1" id="progreso" class="slider" disabled>
            <p id="progreso-texto" class="body"></p>
        </div>

        <div class="button-container">
            <button class="buttonatras" onclick="goToPreviousPage()">ATRÁS</button>
            <button class="button" id="nextButton" disabled onclick="goToNextPage()">SIGUIENTE</button>
        </div>
    </div>

    <script>
        function selectOption(optionId, pregunta, respuesta) {
            var options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            var selectedOption = document.getElementById(optionId);
            selectedOption.classList.add('selected');
            var rb = selectedOption.querySelector('input[type="radio"]');
            if (rb) rb.checked = true;
            document.getElementById('nextButton').disabled = false;

            sessionStorage.setItem(pregunta, respuesta);
            sessionStorage.setItem(pregunta + "_id", optionId);
        }

        function goToNextPage() {
            var selectedOption = document.querySelector('.option.selected');
            if (selectedOption) {
                window.location.href = "9_Pregunta6.html";
            } else {
                alert("Por favor, selecciona una opción antes de continuar.");
            }
        }
        function goToPreviousPage() {
            window.location.href = "7_Pregunta4.html";
        }
        window.onload = function() {
            const clavePregunta = 'r5'; 
            const savedId = sessionStorage.getItem(clavePregunta + "_id");
            if (savedId) {
                const optionToRestore = document.getElementById(savedId);
                if (optionToRestore) {
                    optionToRestore.classList.add('selected');
                    optionToRestore.querySelector('input[type="radio"]').checked = true;
                    document.getElementById('nextButton').disabled = false;
                }
            }
            const preguntaActual = 5; 
            const progresoaActual = preguntaActual -1; 
            const totalPreguntas = 6;
            const slider = document.getElementById('progreso');
            const texto = document.getElementById('progreso-texto');

            if(slider && texto) {
                slider.max = totalPreguntas;
                slider.value = preguntaActual;
                const porcentaje = (progresoaActual / totalPreguntas) * 100;
                slider.style.background = `linear-gradient(to right, #4CAF50 ${porcentaje}%, #ddd ${porcentaje}%)`;
                texto.textContent = `Pregunta ${preguntaActual} de ${totalPreguntas}`;
            }
        };
    </script>
</body>
</html>
